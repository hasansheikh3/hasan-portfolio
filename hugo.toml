# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
baseURL = "https://example.com/"
title = "Hasan Shaikh"
copyright = "© 2026 Hasan Shaikh"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false
mainSections = ["posts"]

[pagination]
  pagerSize = 10

# JSON is required for PaperMod's client-side search.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[params]
  env = "production"
  description = "Hasan Shaikh — notes on software, systems, and side projects."
  author = "Hasan Shaikh"
  defaultTheme = "auto"

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = false
  ShowAllPagesInArchive = true
  ShowPageNums = true
  ShowToc = true
  images = ["images/og-cover.png"]

[params.homeInfoParams]
  Title = "Hello there"
  Content = """
I'm a network engineer who configures, codes, and automates networking
systems for a living. I've spent 4 years at [**7GFuse**](https://www.7gfuse.com),
building multi-WAN routing, VPN bonding, Deep Packet Inspection, and RADIUS based
solutions on OpenWrt and embedded Linux. 

A few things that I have worked with, or learned, are

- **Routing Protocols :** OSPF, BGP, IS-IS, and EIGRP
- **Switching Technologies :** VLANs, STP, Bonding (LACP/Etherchannel), VXLAN, MLAG (for Arista), and vPC (for Cisco)
- **VPN Technologies :** OpenVPN, WireGuard, IPsec, and GRE
- **Identity Management :** RADIUS, TACACS+, Cisco ISE, EntraID
- **Programming Languages :** C++, Python, Bash scripting
- **Operating Systems :** Linux (Debian, Ubuntu, OpenWrt), Windows
- **Troubleshooting Tools :** Wireshark, tcpdump, iperf, ping, and traceroute
- **Monitoring and Observability :** SNMP, Netflow
- **Automation and Configuration Management :** Ansible, Git, Terraform, and CI/CD pipelines




You can connect with me at

- **E-mail:** [hasan@hasanshaikh.com](mailto:hasan@hasanshaikh.com)
- **LinkedIn:** [Muhammad Hasan Shaikh](https://www.linkedin.com/in/muhammad-hasan-shaikh-49727414b/)
- **GitHub:** [hasansheikh3](https://www.github.com/hasansheikh3)


"""

[params.cover]
  # In production, PaperMod emits a responsive srcset for page-bundle covers.
  responsiveImages = true

[params.assets]
  theme_color = "#0ea5e9"
  msapplication_TileColor = "#0ea5e9"

