#   url = "https://x.com/your-handle"

# ---------------------------------------------------------------------------
# Menus
# ---------------------------------------------------------------------------
[[menu.main]]
  name = "Posts"
  url = "posts/"
  weight = 1

[[menu.main]]
  name = "Projects"
  url = "projects/"
  weight = 2

[[menu.main]]
  name = "About"
  url = "about/"
  weight = 3

[[menu.main]]
  name = "Archive"
  url = "archives/"
  weight = 4

[[menu.main]]
  name = "Search"
  url = "search/"
  weight = 5
